<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Forma PDF 工具验证</title><style>body{font:14px/1.8 system-ui;max-width:1100px;margin:35px auto;padding:20px;background:#f5f8ef;color:#295037}h1{font-size:24px}li{padding:11px;border-bottom:1px solid #dce5d2}.error{color:#a75948}#status{font-weight:bold}</style><h1>PDF 工具端到端验证</h1><p>仅使用合成文件，不处理用户内容。</p><p id="status">正在运行…</p><ol id="results"></ol><script type="module">
import{runPDFTool,pdfLib}from'../pdf-ops.mjs';import{pdfDocument,loadScript}from'../engine.mjs';
const results=document.querySelector('#results'),status=document.querySelector('#status');let pass=0,fail=0;const fixtures=new Map();
const assert=(x,msg)=>{if(!x)throw new Error(msg)};
async function file(name){if(!fixtures.has(name)){const r=await fetch('./fixtures/'+name);if(!r.ok)throw new Error('Missing fixture '+name);fixtures.set(name,new File([await r.blob()],name));}return fixtures.get(name);}
async function pdf(result){return(await pdfLib()).PDFDocument.load(await result.blob.arrayBuffer());}
async function test(name,fn){if(new URLSearchParams(location.search).get('only')==='archive'&&!name.startsWith('PDF/A'))return;const li=document.createElement('li');li.textContent=name+' — 运行中';results.append(li);try{await fn();li.textContent='✓ '+name;pass++;}catch(error){li.textContent='✗ '+name+'：'+error.message;li.className='error';fail++;console.error(name,error);}status.textContent=`进行中：${pass} 通过 / ${fail} 失败`;}
const run=async(id,options={},names=['three.pdf'])=>runPDFTool(id,await Promise.all(names.map(file)),options,()=>{});
await test('合并：两份 3 页文档生成 6 页',async()=>{assert((await pdf(await run('pdf-merge',{},['three.pdf','changed.pdf']))).getPageCount()===6,'wrong page count');});
await test('拆分：每页输出 PDF 并打包 ZIP',async()=>{await loadScript('jszip.js');const zip=await JSZip.loadAsync((await run('pdf-split')).blob);assert(Object.keys(zip.files).filter(p=>p.endsWith('.pdf')).length===3,'wrong files');});
await test('拆分：明确分组 1-2;3',async()=>{const zip=await JSZip.loadAsync((await run('pdf-split',{splitMode:'ranges',range:'1-2;3'})).blob);const files=Object.values(zip.files).filter(f=>!f.dir);assert(files.length===2,'wrong groups');assert((await (await pdfLib()).PDFDocument.load(await files[0].async('uint8array'))).getPageCount()===2,'wrong first group');});
await test('删除 / 提取：页数与选择有效',async()=>{assert((await pdf(await run('pdf-remove',{range:'2'}))).getPageCount()===2,'remove failed');assert((await pdf(await run('pdf-extract',{range:'3,1'}))).getPageCount()===2,'extract failed');let rejected=false;try{await run('pdf-remove',{range:'all'});}catch{rejected=true;}assert(rejected,'all-page deletion should be rejected');});
await test('编排：倒序与重复页面',async()=>{const r=await run('pdf-organize',{range:'3,1,1'});const doc=await pdfDocument(new File([r.blob],'r.pdf'));assert(doc.numPages===3,'wrong count');const text=(await(await doc.getPage(1)).getTextContent()).items.map(x=>x.str).join(' ');assert(text.includes('PAGE_THREE'),'wrong first page');await doc.loadingTask.destroy();});
await test('旋转：只改变第二页',async()=>{const doc=await pdf(await run('pdf-rotate',{range:'2',angle:90}));assert(doc.getPage(0).getRotation().angle===0,'unselected rotation changed');assert(doc.getPage(1).getRotation().angle===90,'rotation not applied');});
await test('页码：输出保留文字与页码',async()=>{const r=await run('pdf-numbers',{range:'all',start:3,total:true});const doc=await pdfDocument(new File([r.blob],'numbers.pdf'));const text=(await(await doc.getPage(1)).getTextContent()).items.map(x=>x.str).join(' ');assert(text.includes('3 / 3'),'page number missing');await doc.loadingTask.destroy();});
await test('水印：中文水印写入图像对象',async()=>{const doc=await pdf(await run('pdf-watermark',{range:'1',text:'内部资料',opacity:.25,angle:-20}));const {PDFName}=await pdfLib();assert(doc.getPage(0).node.Resources().lookup(PDFName.of('XObject')).keys().length>0,'watermark missing');});
await test('裁剪：正确设置 CropBox',async()=>{const doc=await pdf(await run('pdf-crop',{range:'1',left:10,right:5,top:15,bottom:5}));const box=doc.getPage(0).getCropBox();assert(Math.abs(box.width-408)<.1&&Math.abs(box.height-512)<.1,'wrong crop dimensions');});
await test('裁剪：旋转页按预览方向裁剪',async()=>{const lib=await pdfLib(),source=await lib.PDFDocument.load(await(await file('three.pdf')).arrayBuffer());source.getPage(0).setRotation(lib.degrees(90));const r=await runPDFTool('pdf-crop',[new File([await source.save()],'rotated.pdf')],{range:'1',left:10,right:5,top:15,bottom:5});const box=(await pdf(r)).getPage(0).getCropBox();assert(Math.abs(box.x-72)<.1&&Math.abs(box.y-64)<.1&&Math.abs(box.width-384)<.1&&Math.abs(box.height-544)<.1,'rotated crop mismatch');});
await test('编辑：中文批注写入且保留原始文字',async()=>{const r=await run('pdf-edit',{range:'1',text:'新增中文批注',x:10,y:30,width:40});const doc=await pdfDocument(new File([r.blob],'edit.pdf'));const text=(await(await doc.getPage(1)).getTextContent()).items.map(x=>x.str).join(' ');assert(text.includes('PAGE_ONE'),'source content lost');await doc.loadingTask.destroy();});
await test('签名：图像签名嵌入所选页面',async()=>{const doc=await pdf(await run('pdf-sign',{range:'1',signature:await file('sample.png'),x:10,y:35,width:35}));assert(doc.getPageCount()===3,'bad document');});
await test('表单：中文视觉填写后扁平化',async()=>{const r=await run('pdf-forms',{formMode:'fill',formValues:{fullName:'测试用户',agree:false}},['form.pdf']);assert((await pdf(r)).getForm().getFields().length===0,'fields not flattened');});
await test('表单：保留可编辑英数字字段',async()=>{const r=await run('pdf-forms',{formMode:'fill',formEditable:true,formValues:{fullName:'Forma Person',agree:false}},['form.pdf']);assert((await pdf(r)).getForm().getTextField('fullName').getText()==='Forma Person','editable value missing');});
await test('表单：创建可填写文本框',async()=>{const r=await run('pdf-forms',{formMode:'create',fieldsText:'姓名|name\n邮箱|email',page:1,y:25});assert((await pdf(r)).getForm().getFields().length===2,'fields missing');});
await test('永久遮盖：移除原始文字和隐藏内容',async()=>{const r=await run('pdf-redact',{redactions:[{page:2,x:0,y:0,w:1,h:.45}]});const doc=await pdfDocument(new File([r.blob],'redacted.pdf'));for(let i=1;i<=doc.numPages;i++){const text=(await(await doc.getPage(i)).getTextContent()).items.map(x=>x.str).join('');assert(!text.trim(),'original text layer remains');}await doc.loadingTask.destroy();assert(r.note.includes('原始文字'),'missing safety note');});
await test('压缩：不返回体积更大的“压缩结果”',async()=>{const source=await file('three.pdf');const r=await run('pdf-compress',{compression:'lossless'});assert(r.blob.size<=source.size,'output larger');});
await test('扫描：图片黑白增强并合并',async()=>{const r=await run('pdf-scan',{scanMode:'bw',threshold:160},['sample.png','sample.png']);assert((await pdf(r)).getPageCount()===2,'missing scan pages');});
await test('PDF → Markdown：包含分页和源文字',async()=>{const r=await run('pdf-markdown'),text=await r.blob.text();assert(text.includes('PAGE_TWO')&&text.includes('第 3 页'),'missing source content');});
await test('PDF → PowerPoint：三张图像幻灯片',async()=>{const r=await run('pdf-ppt'),zip=await JSZip.loadAsync(r.blob);assert(Object.keys(zip.files).filter(p=>/^ppt\/slides\/slide\d+\.xml$/.test(p)).length===3,'wrong slide count');assert(Object.keys(zip.files).some(p=>p.startsWith('ppt/media/')),'page images missing');});
await test('PDF → Excel：提取页面与行列',async()=>{const r=await run('pdf-excel');const book=new ExcelJS.Workbook();await book.xlsx.load(await r.blob.arrayBuffer());assert(book.worksheets.length===3,'missing sheets');assert(book.worksheets[0].getRow(1).getCell(1).text.includes('PAGE_ONE'),'text missing');});
await test('Excel → PDF：中文表格生成有效页面',async()=>{const r=await run('excel-pdf',{},['sheet.xlsx']);assert((await pdf(r)).getPageCount()>=1,'no pages');});
await test('PowerPoint → PDF：基础幻灯片转换',async()=>{const r=await run('ppt-pdf',{},['slides.pptx']);assert((await pdf(r)).getPageCount()===1,'wrong page count');});
await test('HTML → PDF：安全排版基础 HTML',async()=>{const r=await run('html-pdf',{},['page.html']);assert((await pdf(r)).getPageCount()>=1,'no pages');});
await test('比较：正确识别文本与画面变化',async()=>{const r=await run('pdf-compare',{},['three.pdf','changed.pdf']),html=await r.blob.text();assert(html.includes('CHANGED_CONTENT'),'missing text difference');assert(html.includes('1 / 3 页检测到'),'wrong difference count');});
await test('QPDF 修复：输出仍有三页',async()=>{assert((await pdf(await run('pdf-repair'))).getPageCount()===3,'repair failed');});
let encrypted;
await test('QPDF AES-256：加密文件不可直接读取',async()=>{encrypted=await run('pdf-protect',{password:'FormaTest-2026',ownerPassword:'OwnerTest-2026'});let protectedFile=false;try{await pdf(encrypted);}catch{protectedFile=true;}assert(protectedFile,'file not encrypted');});
await test('QPDF 解锁：已知密码恢复可读文档',async()=>{assert(encrypted,'missing encrypted fixture');const r=await runPDFTool('pdf-unlock',[new File([encrypted.blob],'encrypted.pdf')],{password:'FormaTest-2026'});assert((await pdf(r)).getPageCount()===3,'decrypt failed');});
await test('QPDF 解锁：错误密码明确失败',async()=>{let rejected=false;try{await runPDFTool('pdf-unlock',[new File([encrypted.blob],'encrypted.pdf')],{password:'wrong-password'});}catch{rejected=true;}assert(rejected,'wrong password accepted');});
await test('PDF/A：包含 PDF/A-2 元数据与输出色彩配置',async()=>{const r=await run('pdf-pdfa'),doc=await pdfDocument(new File([r.blob],'archive.pdf')),metadata=await doc.getMetadata();const xmp=new DOMParser().parseFromString(metadata.metadata.getRaw(),'application/xml'),descriptions=[...xmp.getElementsByTagNameNS('http://www.w3.org/1999/02/22-rdf-syntax-ns#','Description')],id=descriptions.find(el=>el.hasAttributeNS('http://www.aiim.org/pdfa/ns/id/','part'));assert(id?.getAttributeNS('http://www.aiim.org/pdfa/ns/id/','part')==='2','PDF/A-2 identifier missing');assert(id?.getAttributeNS('http://www.aiim.org/pdfa/ns/id/','conformance')==='B','PDF/A conformance missing');await doc.loadingTask.destroy();const lib=await pdfLib(),document=await pdf(r);assert(document.catalog.has(lib.PDFName.of('OutputIntents')),'missing OutputIntents');});
await test('OCR：英文扫描页识别为可编辑文字',async()=>{const r=await run('pdf-ocr',{range:'1',language:'eng',output:'txt'},['ocr.pdf']);const text=await r.blob.text();assert(text.includes('FORMA')&&text.includes('2026'),'OCR text not recognized: '+text.slice(0,100));});
await test('OCR：简体中文与英文导出 Word',async()=>{const lib=await pdfLib(),{textPNG}=await import('../pdf-ops.mjs'),source=await lib.PDFDocument.create(),image=await source.embedPng(await textPNG('文件格式转换测试\nFORMA 2026',{size:70,color:'#000000',width:1100}));source.addPage([600,300]).drawImage(image,{x:35,y:65,width:530,height:530*image.height/image.width});const r=await runPDFTool('pdf-ocr',[new File([await source.save()],'chinese-scan.pdf')],{range:'1',language:'chi_sim+eng',output:'docx'});await loadScript('jszip.js');const zip=await JSZip.loadAsync(r.blob),xml=await zip.file('word/document.xml').async('string');assert(/[\u4e00-\u9fff]/.test(xml)&&xml.includes('FORMA'),'Chinese/English OCR missing');});
status.textContent=`完成：${pass} 通过 / ${fail} 失败`;document.title=`PDF QA: ${pass} passed, ${fail} failed`;
</script></html>
