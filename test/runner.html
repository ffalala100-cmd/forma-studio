<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Forma 浏览器转换验证</title><style>body{font:15px system-ui;max-width:960px;margin:40px auto;padding:20px;background:#f5f7ef;color:#234531}h1{font-size:24px}li{padding:12px;border-bottom:1px solid #ddd;line-height:1.8}pre{white-space:pre-wrap}#status{font-weight:600}</style><h1>Forma 浏览器端转换验证</h1><p>仅使用合成测试文件；此页面不会发布。</p><p id="status">正在运行…</p><ol id="results"></ol><script type="module">
import {TOOLS,buildPresentation,localOutline} from '../core.mjs';
import {loadScript,convertFile,imagesToPdf,zipOutputs,readText,pdfDocument,imageData,stopVideoEngine} from '../engine.mjs';
const results=document.querySelector('#results');let failed=0,passed=0;
const assert=(x,msg)=>{if(!x)throw new Error(msg)};
async function file(name){const r=await fetch('./fixtures/'+name);if(!r.ok)throw new Error('fixture unavailable');return new File([await r.blob()],name)}
async function test(name,fn){const li=document.createElement('li');li.textContent=name+' — 运行中';results.append(li);try{await fn();li.textContent='✓ '+name;passed++;}catch(e){li.textContent='✗ '+name+'：'+e.message;li.style.color='#a34f42';failed++;}}
const tool=id=>TOOLS.find(t=>t.id===id);
await test('PNG → WebP / JPEG：真实图片编码与尺寸',async()=>{const input=await file('sample.png');for(const type of ['webp','jpg']){const r=await convertFile(input,tool('image-convert'),type,.9);assert(r.blob.size>100,'empty output');assert(r.blob.type===(type==='jpg'?'image/jpeg':'image/webp'),'wrong MIME');const bitmap=await createImageBitmap(r.blob);assert(bitmap.width===320&&bitmap.height===180,'dimensions changed');bitmap.close();}});
await test('PDF → DOCX：可编辑文字和分页',async()=>{const r=await convertFile(await file('sample.pdf'),tool('pdf-word'),'docx',.9);await loadScript('jszip.js');const zip=await JSZip.loadAsync(r.blob);const xml=await zip.file('word/document.xml').async('string');assert(xml.includes('Forma conversion verification'),'missing page one');assert(xml.includes('Second page'),'missing page two');assert(xml.includes('pageBreakBefore'),'missing page break');});
await test('PDF → TXT：两页原文提取',async()=>{const r=await convertFile(await file('sample.pdf'),tool('pdf-text'),'txt',.9);assert((await r.blob.text()).includes('Second page'),'text missing');});
await test('DOCX 中文读取与重新排版 PDF',async()=>{const input=await file('sample.docx');assert((await readText(input)).includes('中文文档'),'Chinese source missing');const r=await convertFile(input,tool('word-pdf'),'pdf',.9);const pdf=await pdfDocument(new File([r.blob],'result.pdf'));assert(pdf.numPages>=1,'missing pages');const page=await pdf.getPage(1),v=page.getViewport({scale:.3}),canvas=document.createElement('canvas');canvas.width=v.width;canvas.height=v.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:v}).promise;canvas.style.width='180px';canvas.style.border='1px solid #ccc';results.lastElementChild.append(canvas);await pdf.loadingTask.destroy();});
await test('多图 → PDF：合并为 2 页',async()=>{const input=await file('sample.png');const r=await imagesToPdf([input,input],()=>{});const pdf=await pdfDocument(new File([r.blob],'images.pdf'));assert(pdf.numPages===2,'wrong page count');await pdf.loadingTask.destroy();});
await test('PDF → PNG ZIP：逐页渲染与打包',async()=>{const r=await convertFile(await file('sample.pdf'),tool('pdf-image'),'png',.9);const zip=await JSZip.loadAsync(r.blob);const names=Object.keys(zip.files).filter(n=>n.endsWith('.png'));assert(names.length===2,'wrong image count');assert((await zip.file(names[0]).async('uint8array'))[0]===137,'invalid PNG');});
await test('批量结果 ZIP：重复文件名安全重命名',async()=>{const r=await zipOutputs([{name:'a.txt',blob:new Blob(['one'])},{name:'a.txt',blob:new Blob(['two'])}]);const zip=await JSZip.loadAsync(r.blob);assert(Object.keys(zip.files).length===2,'overwritten duplicate');});
await test('文件 → PPTX：可编辑中文标题与 6 页结构',async()=>{await loadScript('pptxgen.js');const text=await readText(await file('notes.txt'));const outline=localOutline(text,6,'file'),ppt=buildPresentation(window.PptxGenJS,outline,'green'),blob=await ppt.write({outputType:'blob'});const zip=await JSZip.loadAsync(blob);assert(Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+.xml$/.test(n)).length===6,'wrong slides');assert((await zip.file('ppt/slides/slide1.xml').async('string')).includes('用户体验改进计划'),'Chinese title missing');});
await test('本地 FFmpeg：WAV → MP3',async()=>{const r=await convertFile(await file('tone.wav'),tool('audio-convert'),'mp3',.9,(p,msg)=>{document.querySelector('#status').textContent=msg||'音频转换中';});assert(r.blob.size>100,'empty MP3');assert(r.blob.type==='audio/mpeg','wrong mime');});
await test('本地 FFmpeg：MP4 → MOV / WebM',async()=>{for(const type of ['mov','webm']){const r=await convertFile(await file('sample.mp4'),tool('video-convert'),type,.9);assert(r.blob.size>100,'empty video');const data=new Uint8Array(await r.blob.arrayBuffer());if(type==='mov')assert(new TextDecoder().decode(data.slice(4,8))==='ftyp','invalid MOV');else assert(data[0]===0x1a&&data[1]===0x45,'invalid WebM');}});
stopVideoEngine();document.querySelector('#status').textContent=`完成：${passed} 通过 / ${failed} 失败`;document.title=`Forma QA: ${passed} passed, ${failed} failed`;
</script></html>
