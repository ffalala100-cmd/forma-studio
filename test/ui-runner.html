<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PDF 工作台交互验证</title><style>body{font:14px/1.8 system-ui;color:#294a32;margin:25px}iframe{width:1200px;height:780px;border:1px solid #ddd;position:absolute;left:-1300px}li{padding:10px;border-bottom:1px solid #ddd}.error{color:#a45544}</style><h1>PDF 工作台交互验证</h1><p id="status">加载工作台…</p><ol id="results"></ol><iframe id="app" src="../#pdf"></iframe><script type="module">
import{pdfLib}from'../pdf-ops.mjs';import{loadScript}from'../engine.mjs';
const frame=document.querySelector('#app'),out=document.querySelector('#results');let pass=0,fail=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));const assert=(v,m)=>{if(!v)throw new Error(m)};
async function wait(fn,timeout=20000){const started=Date.now();while(Date.now()-started<timeout){const value=fn();if(value)return value;await sleep(50);}throw new Error('UI 状态等待超时');}
async function test(name,fn){const li=document.createElement('li');li.textContent=name+' — 运行中';out.append(li);try{await fn();li.textContent='✓ '+name;pass++;}catch(e){li.className='error';li.textContent='✗ '+name+'：'+e.message;fail++;console.error(name,e);}document.querySelector('#status').textContent=`进行中：${pass} 通过 / ${fail} 失败`;}
await wait(()=>frame.contentDocument?.querySelector('#pdfCenterGroups'));
const doc=frame.contentDocument,win=frame.contentWindow;const event=()=>new win.Event('input',{bubbles:true});
const originalFetch=win.fetch.bind(win),requests=[];let rejectAI=false;
win.fetch=async(url,options)=>{if(String(url).startsWith('https://ai.example.invalid/')){requests.push({url:String(url),body:JSON.parse(options.body),authorization:options.headers.Authorization});return new win.Response(rejectAI?JSON.stringify({error:'test'}):JSON.stringify({choices:[{finish_reason:'stop',message:{content:JSON.parse(options.body).messages[0].content.includes('译者')?'这是测试译文。\n保留文档事实。':'# 测试摘要\n\n- 关键要点来自文档。'}}]}),{status:rejectAI?401:200,headers:{'Content-Type':'application/json'}});}return originalFetch(url,options);};
async function open(id){doc.querySelector('#main [data-pdf-tool="'+id+'"]').click();await wait(()=>doc.querySelector('.pdf-work-dialog[open]'));}
function close(){doc.querySelector('#closePDF').click();}
function set(name,value){const input=doc.querySelector('[data-option="'+name+'"]');input.value=value;input.dispatchEvent(event());}
async function upload(){const f=await fetch('./fixtures/three.pdf').then(r=>r.blob()),transfer=new win.DataTransfer();transfer.items.add(new win.File([f],'three.pdf',{type:'application/pdf'}));const input=doc.querySelector('#pdfFiles');input.files=transfer.files;input.dispatchEvent(new win.Event('change',{bubbles:true}));await wait(()=>doc.querySelector('#pdfCanvasWrap')?.hidden===false);}
await test('七组 33 个工具与顶部菜单均可打开',async()=>{assert(doc.querySelectorAll('#main [data-pdf-tool]').length===33,'tool count');doc.querySelector('#pdfMega summary').click();assert(doc.querySelector('#pdfMega').open,'menu did not open');assert(doc.querySelectorAll('#pdfMega [data-pdf-tool]').length===33,'menu tool count');doc.querySelector('#pdfMega summary').click();});
await test('提取页面：上传、预览、范围、下载形成完整流程',async()=>{await open('pdf-extract');await upload();set('range','3,1');doc.querySelector('#runPDF').click();const link=await wait(()=>doc.querySelector('#pdfWorkResults a[download]'));const bytes=await originalFetch(link.href).then(r=>r.arrayBuffer()),pdf=await(await pdfLib()).PDFDocument.load(new Uint8Array(bytes));assert(pdf.getPageCount()===2,'wrong extracted count');await wait(()=>!doc.querySelector('#runPDF').disabled);close();});
await test('错误页码：显示真实错误且不提供假下载',async()=>{await open('pdf-extract');await upload();set('range','500');doc.querySelector('#runPDF').click();await wait(()=>doc.querySelector('#pdfWorkError').textContent.includes('页码'));assert(!doc.querySelector('#pdfWorkResults a'),'unexpected download');await wait(()=>!doc.querySelector('#runPDF').disabled);close();});
await test('拆分设置：分组模式与页面范围保持一致',async()=>{await open('pdf-split');assert(doc.querySelector('[data-option="range"]').closest('.pdf-field').hidden,'page mode should hide ranges');set('splitMode','ranges');assert(!doc.querySelector('[data-option="range"]').closest('.pdf-field').hidden,'group ranges not shown');set('range','1-2;3');await upload();doc.querySelector('#runPDF').click();const link=await wait(()=>doc.querySelector('#pdfWorkResults a[download]'));await loadScript('jszip.js');const zip=await JSZip.loadAsync(await originalFetch(link.href).then(r=>r.blob()));assert(Object.keys(zip.files).filter(p=>p.endsWith('.pdf')).length===2,'wrong split groups');await wait(()=>!doc.querySelector('#runPDF').disabled);close();});
await test('AI 摘要：明确配置、提取文字、发送请求并下载',async()=>{await open('pdf-summary');doc.querySelector('#pdfConfigureAI').click();await wait(()=>doc.querySelector('#apiForm'));doc.querySelector('#apiEndpoint').value='https://ai.example.invalid/v1';doc.querySelector('#apiModel').value='test-model';doc.querySelector('#apiKey').value='TEST_ONLY_NO_CREDENTIAL';doc.querySelector('#apiForm').dispatchEvent(new win.Event('submit',{bubbles:true,cancelable:true}));await wait(()=>!doc.querySelector('#infoDialog').open);await upload();doc.querySelector('#runPDF').click();const link=await wait(()=>doc.querySelector('#pdfWorkResults a[download]'));const text=await originalFetch(link.href).then(r=>r.text());assert(text.includes('测试摘要'),'summary missing');assert(requests.at(-1).body.messages[1].content.includes('PAGE_ONE'),'source text not sent');assert(requests.at(-1).authorization==='Bearer TEST_ONLY_NO_CREDENTIAL','wrong auth');for(let i=0;i<win.localStorage.length;i++)assert(!String(win.localStorage.getItem(win.localStorage.key(i))).includes('TEST_ONLY_NO_CREDENTIAL'),'API key persisted');await wait(()=>!doc.querySelector('#runPDF').disabled);close();});
await test('AI 翻译：生成包含译文的可编辑 Word',async()=>{await open('pdf-translate');await upload();doc.querySelector('#runPDF').click();const link=await wait(()=>doc.querySelector('#pdfWorkResults a[download]'));await loadScript('jszip.js');const zip=await JSZip.loadAsync(await originalFetch(link.href).then(r=>r.blob()));assert((await zip.file('word/document.xml').async('string')).includes('这是测试译文'),'translation missing');await wait(()=>!doc.querySelector('#runPDF').disabled);close();});
await test('AI 接口失败：明确显示 HTTP 错误',async()=>{rejectAI=true;await open('pdf-summary');await upload();doc.querySelector('#runPDF').click();await wait(()=>doc.querySelector('#pdfWorkError').textContent.includes('401'));assert(!doc.querySelector('#pdfWorkResults a'),'download on failure');await wait(()=>!doc.querySelector('#runPDF').disabled);close();});
document.querySelector('#status').textContent=`完成：${pass} 通过 / ${fail} 失败`;document.title=`PDF UI QA: ${pass} passed, ${fail} failed`;
</script></html>
